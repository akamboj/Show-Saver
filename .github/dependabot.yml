version: 2
updates:
  # pip and docker bumps ship in the image, so their PRs are titled
  # fix(deps): … — release-please counts that as a PATCH and queues a
  # release PR. github-actions bumps are CI-only and stay build(deps):.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      python-deps:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "yt-dlp"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
