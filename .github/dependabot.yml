version: 2
updates:
  # Shipped deps (pip, docker) use fix(deps): so release-please cuts a PATCH;
  # dev-only and github-actions bumps use build(deps): and don't release.
  # One pip block (Dependabot allows one per ecosystem+directory): yt-dlp gets
  # its own PR with no cooldown; everything else is grouped behind 3 days.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    cooldown:
      default-days: 3
      exclude:
        - "yt-dlp"
    groups:
      python-deps:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "yt-dlp"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
